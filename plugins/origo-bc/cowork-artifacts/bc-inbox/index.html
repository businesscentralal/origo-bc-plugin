<body>
<header>
  <h1>📥 Innhólf mitt <span class="company-tag" id="companyTag"></span></h1>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">Hleður…</span>
    <button class="btn-settings" id="btnSettings" onclick="openSettings()" title="Stillingar">⚙️</button>
    <button class="btn-reload" id="btnReload" onclick="reload()">↺ Uppfæra</button>
  </div>
</header>
<div class="summary-bar" id="summaryBar"></div>
<div class="main-wrap">
  <div class="panel">
    <div class="top-tabs">
      <button class="top-tab active" id="topTabApprovals" onclick="switchTopTab('approvals',this)">
        ✅ Samþykktir <span class="badge badge-orange" id="badgeApprovals">…</span>
      </button>
      <button class="top-tab" id="topTabNotifs" onclick="switchTopTab('notifs',this)">
        🔔 Skilaboð <span class="badge badge-blue" id="badgeNotifs">…</span>
      </button>
    </div>
    <div class="tab-pane active" id="paneApprovals">
      <div class="sub-tabs">
        <button class="sub-tab active" id="subTabOpen" onclick="setApprovalTab('open',this)">Opnar <span class="tc" id="tcOpen">…</span></button>
        <button class="sub-tab" id="subTabAll" onclick="setApprovalTab('all',this)">Allar <span class="tc" id="tcAll">…</span></button>
      </div>
      <div class="panel-body" id="approvalBody"><div class="state-box"><div class="spinner"></div><br>Sæki samþykktir…</div></div>
    </div>
    <div class="tab-pane" id="paneNotifs">
      <div class="sub-tabs">
        <button class="sub-tab active" id="subTabUnread" onclick="setNotifTab('unread',this)">Ólesnar <span class="tc" id="tcUnread">…</span></button>
        <button class="sub-tab" id="subTabAllNotif" onclick="setNotifTab('all',this)">Allar <span class="tc" id="tcAllNotif">…</span></button>
      </div>
      <div class="panel-body" id="notifBody"><div class="state-box"><div class="spinner"></div><br>Sæki skilaboð…</div></div>
    </div>
  </div>
</div>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawerTitle"></div>
    <div class="drawer-header-actions">
      <div id="drawerHeaderActions"></div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h2>⚙️ Veldu BC umhverfi</h2>
    <label for="selectBcServer">Business Central tenging</label>
    <div id="serverPickerWrap">
      <div class="server-loading"><span class="spinner-sm"></span> Leita að umhverfum…</div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeSettings()">Hætta við</button>
      <button class="btn-modal-save" id="btnSaveSettings" onclick="saveSettings()" disabled>Vista og endurhlaða</button>
    </div>
  </div>
</div>
<script>
// ── BC tengistillingar ────────────────────────────────────────────────────
// Breyttu þessu í þitt BC server-nafn, eða notaðu stillingagluggann (⚙️)
const DEFAULT_BC_SERVER = 'bc-origo-demo';
let BC_SERVER = localStorage.getItem('bc_inbox_server') || DEFAULT_BC_SERVER;

function openSettings(){
  document.getElementById('settingsOverlay').classList.add('open');
  discoverAndRenderServers();
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('open'); }
function saveSettings(){
  const sel = document.getElementById('selectBcServer');
  if(sel && sel.value){ BC_SERVER = sel.value; localStorage.setItem('bc_inbox_server', sel.value); }
  closeSettings();
  reload();
}

async function discoverAndRenderServers(){
  const wrap = document.getElementById('serverPickerWrap');
  const saveBtn = document.getElementById('btnSaveSettings');
  wrap.innerHTML = '<div class="server-loading"><span class="spinner-sm"></span> Leita að umhverfum…</div>';
  saveBtn.disabled = true;
  try {
    // 1. Collect server names from meta block
    const metaEl = document.getElementById('cowork-artifact-meta');
    const meta = metaEl ? JSON.parse(metaEl.textContent) : {};
    const fromMeta = new Set(meta.mcpServerNames || []);

    // 2. Also try common bc-* name patterns — who_am_i fails silently if not registered
    const commonNames = [
      'bc-origo-demo','bc-cloud-events-setup','bc-origo-setup',
      'bc-production','bc-prod','bc-staging','bc-stage','bc-test',
      'bc-demo','bc-sandbox','bc-dev','bc-main','bc-live',
      DEFAULT_BC_SERVER, BC_SERVER
    ];
    commonNames.forEach(n => fromMeta.add(n));

    const servers = [...fromMeta].filter(Boolean);

    // 3. Probe all in parallel — settled so failures are silent
    const results = await Promise.allSettled(
      servers.map(async s => {
        const raw = await window.cowork.callMcpTool(`mcp__${s}__who_am_i`, {});
        const d = unwrap(raw);
        // Only accept responses with a real companyInfo.name — anything else is not a live BC connection
        const company = d?.companyInfo?.name;
        if(!company) throw new Error('not a valid BC response');
        const user = d?.user?.name || d?.user?.id || '';
        return { server: s, company, user };
      })
    );

    const found = results
      .filter(r => r.status === 'fulfilled')
      .map(r => r.value)
      // Deduplicate by server name
      .filter((f, i, arr) => arr.findIndex(x => x.server === f.server) === i);

    if(found.length === 0){
      wrap.innerHTML = '<div class="server-error">Engin BC umhverfi fundust. Athugaðu tengingar í Cowork stillingum.</div>';
      return;
    }

    const opts = found.map(f =>
      `<option value="${f.server}" ${f.server === BC_SERVER ? 'selected' : ''}>${f.company} (${f.server})</option>`
    ).join('');
    wrap.innerHTML = `<select id="selectBcServer">${opts}</select>
      <p class="modal-hint" style="margin-top:8px">Fundust ${found.length} umhverfi. Veldu það sem þú vilt nota.</p>`;
    saveBtn.disabled = false;
  } catch(e) {
    wrap.innerHTML = `<div class="server-error">Villa við leit: ${e.message||e}</div>`;
  }
}

const ISK = new Intl.NumberFormat('is-IS',{style:'currency',currency:'ISK',maximumFractionDigits:0});
const DT  = new Intl.DateTimeFormat('is-IS',{day:'2-digit',month:'2-digit',year:'numeric'});
function relTime(iso){if(!iso)return '';const d=new Date(iso),diff=(Date.now()-d)/60000;if(diff<1)return 'Rétt í þessu';if(diff<60)return Math.round(diff)+' mín síðan';if(diff<1440)return Math.round(diff/60)+' klst síðan';if(diff<10080)return Math.round(diff/1440)+' dagar síðan';return DT.format(d);}
function dueChip(d){if(!d)return '';const date=new Date(d),diff=(date-Date.now())/86400000;let cls,label;if(diff<0){cls='due-overdue';label='Líðið! '+DT.format(date);}else if(diff<7){cls='due-soon';label='Gjalddagi: '+DT.format(date);}else{cls='due-ok';label='Gjalddagi: '+DT.format(date);}return `<span class="due-chip ${cls}">${label}</span>`;}
function statusChip(s){const m={'Open':['sc-chip-open','Opið'],'Approved':['sc-chip-approved','Samþykkt'],'Rejected':['sc-chip-rejected','Hafnað']};const[cls,label]=m[s]||['sc-chip-pending',s||'—'];return `<span class="sc-chip ${cls}">${label}</span>`;}
function formatUser(id){if(!id)return '—';return id.replace(/\./g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function parseBody(raw){if(!raw)return '—';return raw.replace(/\*\*/g,'').replace(/^##\s*/gm,'').replace(/^#\s*/gm,'').trim();}
function unwrap(raw){if(!raw)return {};if(typeof raw==='string'){try{return JSON.parse(raw);}catch{return {};}}if(Array.isArray(raw?.content)){const t=raw.content.find(c=>c.type==='text');if(t?.text){try{return JSON.parse(t.text);}catch{return {};}}}return raw;}
function getTableId(a){const cap=(a.tableCaption||'').toLowerCase();if(cap.includes('innkaup')||cap.includes('purchase'))return 38;if(cap.includes('sölu')||cap.includes('sala')||cap.includes('sales'))return 36;return null;}
function resolveDocLineType(a){const cap=(a.tableCaption||'').toLowerCase(),dt=(a.documentType||'').toLowerCase();const isPurch=cap.includes('innkaup')||cap.includes('purchase');const isSales=cap.includes('sölu')||cap.includes('sala')||cap.includes('sales');const isOrder=dt.includes('pöntun')||dt.includes('order');const isCredit=dt.includes('kredit')||dt.includes('credit');const isQuote=dt.includes('tilboð')||dt.includes('quote');if(isPurch){if(isOrder)return 'purchase order';if(isCredit)return 'purchase credit memo';if(isQuote)return 'purchase quote';return 'purchase invoice';}if(isSales){if(isOrder)return 'sales order';if(isCredit)return 'sales credit memo';if(isQuote)return 'sales quote';return 'sales invoice';}return null;}

// ── BC table name for get_page_url ────────────────────────────────────────
function resolveTableForBC(a){
  const cap=(a.tableCaption||'').toLowerCase();
  if(cap.includes('innkaup')||cap.includes('purchase'))return 'Purchase Header';
  if(cap.includes('sölu')||cap.includes('sala')||cap.includes('sales'))return 'Sales Header';
  return null;
}
function isPurchase(a){
  const cap=(a.tableCaption||'').toLowerCase();
  return cap.includes('innkaup')||cap.includes('purchase');
}

let allApprovals=[],allNotifs=[],approvalTab='open',notifTab='unread';
let idxByEntryNo={},idxByRecordId={};
let currentApprovalIdx=-1;

function buildIndexes(){idxByEntryNo={};idxByRecordId={};allApprovals.forEach(a=>{idxByEntryNo[a.entryNo]=a;if(a.recordSystemId)idxByRecordId[a.recordSystemId.toUpperCase()]=a;});}
function findLinked(n){if(n.approvalEntryNo>0&&idxByEntryNo[n.approvalEntryNo])return idxByEntryNo[n.approvalEntryNo];const rId=n.relatedRecordSystemId;if(rId&&rId!=='00000000-0000-0000-0000-000000000000')return idxByRecordId[rId.toUpperCase()]||null;return null;}
function hasUnreadNotif(a){return allNotifs.some(n=>!n.isRead&&findLinked(n)===a);}

async function loadApprovals(){const raw=await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_my_approvals`,{});allApprovals=unwrap(raw).result||[];}
async function loadNotifications(){const raw=await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_notifications`,{take:100});allNotifs=unwrap(raw).result||[];}
async function loadCompanyName(){try{const raw=await window.cowork.callMcpTool(`mcp__${BC_SERVER}__who_am_i`,{});const d=unwrap(raw);const co=d?.companyInfo?.name||d?.company||BC_SERVER;document.getElementById('companyTag').textContent='— '+co;document.title='Innhólf — '+co;}catch(e){document.getElementById('companyTag').textContent='— '+BC_SERVER;}}

function renderSummary(){const open=allApprovals.filter(a=>a.status==='Open').length,done=allApprovals.filter(a=>a.status==='Approved').length,unread=allNotifs.filter(n=>!n.isRead).length;document.getElementById('summaryBar').innerHTML=`${open>0?`<span class="summary-chip sc-open">🔴 ${open} opin samþykktarb.</span>`:''}<span class="summary-chip sc-done">✅ ${done} samþykkt</span>${unread>0?`<span class="summary-chip sc-unread">🔵 ${unread} ólesin skilaboð</span>`:''}`.trim();}

function switchTopTab(tab,btn){document.querySelectorAll('.top-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));document.getElementById(tab==='approvals'?'paneApprovals':'paneNotifs').classList.add('active');}
function setApprovalTab(tab,btn){approvalTab=tab;document.querySelectorAll('#subTabOpen,#subTabAll').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderApprovals();}
function setNotifTab(tab,btn){notifTab=tab;document.querySelectorAll('#subTabUnread,#subTabAllNotif').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderNotifications();}

function renderApprovals(){
  const open=allApprovals.filter(a=>a.status==='Open');
  document.getElementById('tcOpen').textContent=open.length;
  document.getElementById('tcAll').textContent=allApprovals.length;
  document.getElementById('badgeApprovals').textContent=open.length;
  const items=approvalTab==='open'?open:allApprovals;
  const el=document.getElementById('approvalBody');
  if(items.length===0){el.innerHTML=approvalTab==='open'?'<div class="state-box"><div class="icon">🎉</div>Engar opnar samþykktarbeiðnir</div>':'<div class="state-box"><div class="icon">📋</div>Engar samþykktarfærslur</div>';return;}
  el.innerHTML=items.map(a=>{const idx=allApprovals.indexOf(a),isOpen=a.status==='Open',unread=hasUnreadNotif(a);return `<div class="approval-card" onclick="openApprovalDrawer(${idx})"><div class="ac-icon ${isOpen?'open-icon':''}">${isOpen?'⏳':a.status==='Approved'?'✅':'❌'}</div><div class="ac-body"><div class="ac-top"><div><div class="ac-doc">${a.documentNo}</div><div class="ac-sub">${a.tableCaption||''} · ${a.approvalCode||''}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><div class="ac-amount">${ISK.format(parseFloat(a.amountLCY||0))}</div>${unread?'<div class="unread-indicator" title="Ólesin skilaboð tengd þessum skjali"></div>':''}</div></div><div class="ac-meta">${statusChip(a.status)}${dueChip(a.dueDate)}</div></div></div>`;}).join('');}

function renderNotifications(){
  const unread=allNotifs.filter(n=>!n.isRead);
  document.getElementById('tcUnread').textContent=unread.length;
  document.getElementById('tcAllNotif').textContent=allNotifs.length;
  document.getElementById('badgeNotifs').textContent=unread.length;
  const items=notifTab==='unread'?unread:allNotifs;
  const el=document.getElementById('notifBody');
  if(items.length===0){el.innerHTML=notifTab==='unread'?'<div class="state-box"><div class="icon">✨</div>Engin ólesin skilaboð</div>':'<div class="state-box"><div class="icon">📬</div>Engin skilaboð</div>';return;}
  el.innerHTML=items.map(n=>{const linked=findLinked(n),readCls=n.isRead?' is-read':'',icon=linked?'📋':({'New Record':'📄','Approval':'✅','Overdue':'⚠️'}[n.notificationType]||'💬'),iconCls=linked?' approval-icon':'',gi=allNotifs.indexOf(n),laChip=linked?`<span class="la-chip">📋 ${linked.documentNo} ${statusChip(linked.status)} ${ISK.format(parseFloat(linked.amountLCY||0))}</span>`:'';return `<div class="notif-row${readCls}" onclick="openNotifDrawer(${gi})"><div class="notif-icon${iconCls}">${icon}</div><div><div class="notif-subject">${n.subject||n.notificationType||'—'}</div><div class="notif-sender">Frá: ${formatUser(n.senderUserId)}</div>${laChip?`<div class="notif-meta">${laChip}</div>`:''}</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div class="notif-time">${relTime(n.systemCreatedAt)}</div>${!n.isRead?'<div class="unread-dot"></div>':''}</div></div>`;}).join('');}

// ── Approval comments ──────────────────────────────────────────────────────
async function renderComments(containerId, a) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '<div class="lines-loading"><span class="spinner-sm"></span>Sæki athugasemdir…</div>';
  try {
    const tableId = getTableId(a);
    const filter = tableId
      ? `WHERE(Document No.=CONST(${a.documentNo}),Table ID=CONST(${tableId}))`
      : `WHERE(Document No.=CONST(${a.documentNo}))`;
    const raw  = await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_records`, { table: 'Approval Comment Line', filter, lcid: 1039 });
    const data = unwrap(raw);
    const comments = data.result || (Array.isArray(data) ? data : []);
    if (comments.length === 0) { el.innerHTML = '<p class="lines-empty">Engar athugasemdir.</p>'; return; }
    el.innerHTML = comments.map(c => {
      const f = c.fields || c;
      const user = formatUser(f.userID || f.UserID || '');
      const ts   = f.dateandTime || f.DateandTime || f.dateAndTime || f.DateAndTime || '';
      const text = f.comment || f.Comment || '—';
      return `<div class="comment-item"><div class="comment-header"><span class="comment-user">${user}</span><span class="comment-time">${relTime(ts)||DT.format(new Date(ts))}</span></div><div class="comment-text">${text}</div></div>`;
    }).join('');
  } catch(e) { el.innerHTML = `<p class="lines-empty" style="color:#b91c1c">Villa: ${e.message||e}</p>`; }
}

// ── Open in BC ─────────────────────────────────────────────────────────────
async function doOpenInBC(idx, btnId) {
  const a = allApprovals[idx];
  if (!a) return;
  const table = resolveTableForBC(a);
  const id    = a.recordSystemId;
  if (!table || !id || id === '00000000-0000-0000-0000-000000000000') return;
  const btn = btnId ? document.getElementById(btnId) : null;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  // Open a blank window NOW — must be synchronous within the user gesture.
  // After the async get_page_url call the gesture context is gone and popups are blocked.
  const newWin = window.open('', '_blank');

  try {
    const raw  = await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_page_url`, { table, id });
    const data = unwrap(raw);
    const url  = typeof data === 'string' ? data
      : (data.url || data.pageUrl || data.webClientUrl
         || Object.values(data).find(v => typeof v === 'string' && v.startsWith('http')));
    if (url && newWin) {
      newWin.location.href = url;
    } else if (!url && newWin) {
      newWin.close();
    }
    if (btn) { btn.disabled = false; btn.textContent = '↗ Opna í BC'; }
  } catch(e) {
    console.error('get_page_url', e);
    if (newWin) newWin.close();
    if (btn) { btn.disabled = false; btn.textContent = '↗ Opna í BC'; }
  }
}

// ── Email vendor: toggle form ───────────────────────────────────────────────
function toggleEmailForm() {
  const f = document.getElementById('emailForm');
  if (!f) return;
  const opening = !f.classList.contains('visible');
  f.classList.toggle('visible');
  if (opening && currentApprovalIdx >= 0) {
    loadVendorAndShowEmailForm(allApprovals[currentApprovalIdx]);
  }
}

// ── Email vendor: fetch vendor email from Purchase Header ───────────────────
async function loadVendorAndShowEmailForm(a) {
  const loadEl   = document.getElementById('emailVendorLoading');
  const fieldsEl = document.getElementById('emailFormFields');
  if (!loadEl || !fieldsEl) return;
  loadEl.style.display   = 'flex';
  fieldsEl.style.display = 'none';
  document.getElementById('emailResult').innerHTML = '';

  let vendorEmail = '', vendorName = '';
  try {
    const raw  = await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_records`, {
      table: 'Purchase Header',
      filter: `WHERE(No.=CONST(${a.documentNo}))`,
      take: 1, lcid: 1039
    });
    const data = unwrap(raw);
    const rec  = data.result?.[0] || (Array.isArray(data) ? data[0] : null);
    const f    = rec?.fields || rec || {};
    vendorEmail = f['Buy-from E-Mail'] || f['BuyFromEmail']    || f['E-Mail']          || '';
    vendorName  = f['Buy-from Vendor Name'] || f['BuyFromVendorName'] || f['Buy-from Vendor No.'] || '';
  } catch(e) { console.error('Vendor fetch failed', e); }

  const toEl      = document.getElementById('emailTo');
  const subjectEl = document.getElementById('emailSubject');
  const bodyEl    = document.getElementById('emailBody');
  if (toEl)      toEl.value      = vendorEmail;
  if (subjectEl) subjectEl.value = `Fyrirspurn vegna reiknings ${a.documentNo}`;
  if (bodyEl)    bodyEl.value    =
    `Sæl/l${vendorName ? ' ' + vendorName : ''},\n\n` +
    `Við erum að fara yfir reikning ${a.documentNo}` +
    `${a.amountLCY ? ' að upphæð ' + ISK.format(parseFloat(a.amountLCY)) : ''} ` +
    `og höfum nokkrar spurningar.\n\n` +
    `[Skrifaðu fyrirspurnina hér…]\n\nKveðja,`;

  loadEl.style.display   = 'none';
  fieldsEl.style.display = 'block';
  if (toEl && !toEl.value) toEl.focus();
  else bodyEl?.focus();
}

// ── Email vendor: create draft in BC outbox ─────────────────────────────────
async function doCreateEmailDraft() {
  const to      = (document.getElementById('emailTo')?.value      || '').trim();
  const subject = (document.getElementById('emailSubject')?.value  || '').trim();
  const body    = (document.getElementById('emailBody')?.value     || '').trim();
  const btn     = document.getElementById('emailSendBtn');
  const res     = document.getElementById('emailResult');
  if (!to || !subject) {
    if (res) res.innerHTML = '<div class="action-error">✗ Fylla þarf út viðtakanda og efni</div>';
    return;
  }
  if (btn) btn.disabled = true;
  if (res) res.innerHTML = '<div class="action-loading"><span class="spinner-sm"></span>Stofna drög í BC…</div>';
  try {
    const a             = allApprovals[currentApprovalIdx];
    const relatedTableId = isPurchase(a) ? 38 : 36;
    const raw  = await window.cowork.callMcpTool(`mcp__${BC_SERVER}__create_email_draft`, {
      to, subject, body, relatedTableId
    });
    const data = unwrap(raw);
    const outboxUrl = data.outboxUrl || data.url || data.webClientUrl
      || Object.values(data).find(v => typeof v === 'string' && v.startsWith('http'));
    if (outboxUrl) {
      if (res) res.innerHTML =
        `<div class="action-success">✓ Drög stofnuð — <a href="${outboxUrl}" target="_blank" style="color:#15803d;font-weight:700;text-decoration:underline">Opna í BC til að senda →</a></div>`;
      window.open(outboxUrl, '_blank');
    } else {
      if (res) res.innerHTML = '<div class="action-success">✓ Drög stofnuð í BC</div>';
    }
    document.getElementById('emailForm')?.classList.remove('visible');
  } catch(e) {
    if (res) res.innerHTML = `<div class="action-error">✗ ${e.message||e}</div>`;
    if (btn) btn.disabled = false;
  }
}

// ── Reply to notification ──────────────────────────────────────────────────
function toggleReply() {
  const f = document.getElementById('replyForm');
  if (!f) return;
  f.classList.toggle('visible');
  if (f.classList.contains('visible')) document.getElementById('replyText')?.focus();
}
async function doReply(nIdx) {
  const n = allNotifs[nIdx];
  const text = (document.getElementById('replyText')?.value || '').trim();
  if (!text) return;
  const btn = document.getElementById('replyBtn');
  const res = document.getElementById('replyResult');
  if (btn) btn.disabled = true;
  if (res) res.innerHTML = '<div class="action-loading"><span class="spinner-sm"></span>Sendir…</div>';
  try {
    await window.cowork.callMcpTool(`mcp__${BC_SERVER}__send_notification`, {
      recipientUserId: n.senderUserId,
      subject: 'Svar: ' + (n.subject || n.notificationType || ''),
      body: text, threadId: n.threadId, parentEntryNo: n.entryNo
    });
    if (res) res.innerHTML = '<div class="action-success">✓ Svar sent til ' + formatUser(n.senderUserId) + '</div>';
    if (document.getElementById('replyText')) document.getElementById('replyText').value = '';
    document.getElementById('replyForm')?.classList.remove('visible');
  } catch(e) {
    if (res) res.innerHTML = `<div class="action-error">✗ ${e.message||e}</div>`;
    if (btn) btn.disabled = false;
  }
}

function openDrawer(){document.getElementById('drawerOverlay').classList.add('open');document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('drawerOverlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');}

async function renderLines(cId,a){
  const el=document.getElementById(cId);if(!el)return;
  const docType=resolveDocLineType(a);
  if(!docType){el.innerHTML='<p class="lines-empty">Ekki hægt að ákvarða gerð skjals.</p>';return;}
  el.innerHTML='<div class="lines-loading"><span class="spinner-sm"></span>Sæki línur…</div>';
  try{
    const raw=await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_document_lines`,{documentNo:a.documentNo,documentType:docType,lcid:1039});
    const data=unwrap(raw);
    const lines=data.result||data.records||data.lines||(Array.isArray(data)?data:[]);
    if(lines.length===0){el.innerHTML='<p class="lines-empty">Engar línur fundust.</p>';return;}
    let total=0;
    const rows=lines.map(l=>{
      const f=l.fields||l;
      const desc=f.Description||f.description||f.name||'—';
      const itemNo=f.No_||f.no||f.No||f.itemNo||'';
      const qty=f.Quantity!==undefined?f.Quantity:(f.quantity!==undefined?f.quantity:'');
      const uPrice=parseFloat(f.DirectUnitCost||f.UnitCostLCY||f.unitPrice||f.UnitPrice||f.unitCost||0);
      const amt=parseFloat(f.Amount||f.LineAmount||f.lineAmount||f.amount||f.amountExclVAT||0);
      total+=amt;
      return `<tr><td class="desc">${desc}${itemNo?`<small>${itemNo}</small>`:''}</td><td class="num">${qty!==''&&qty!=='0'?qty:'—'}</td><td class="num">${uPrice?ISK.format(uPrice):'—'}</td><td class="num">${ISK.format(amt)}</td></tr>`;
    }).join('');
    el.innerHTML=`<table class="lines-table"><thead><tr><th>Lýsing</th><th class="num">Magn</th><th class="num">Einingaverð</th><th class="num">Upphæð</th></tr></thead><tbody>${rows}<tr class="total-row"><td colspan="3">Samtals</td><td class="num">${ISK.format(total)}</td></tr></tbody></table>`;
  }catch(e){el.innerHTML=`<p class="lines-empty" style="color:#b91c1c">Villa: ${e.message||e}</p>`;}
}

// ── Notification drawer ─────────────────────────────────────────────────────
async function openNotifDrawer(idx){
  const n=allNotifs[idx],linked=findLinked(n),linkedIdx=linked?allApprovals.indexOf(linked):-1;

  document.getElementById('drawerTitle').innerHTML=
    `<span>${linked?'📋':({'New Record':'📄','Approval':'✅','Overdue':'⚠️'}[n.notificationType]||'💬')}</span><span class="drawer-title-text">${n.subject||n.notificationType||'—'}</span>`;

  // Header: BC link for linked approval
  const linkedHasBcLink = linked && linked.recordSystemId
    && linked.recordSystemId !== '00000000-0000-0000-0000-000000000000'
    && resolveTableForBC(linked) && linkedIdx >= 0;
  document.getElementById('drawerHeaderActions').innerHTML = linkedHasBcLink
    ? `<button class="btn-bc-link" id="bcLinkBtnN" onclick="doOpenInBC(${linkedIdx},'bcLinkBtnN')">↗ Opna í BC</button>`
    : '';

  document.getElementById('drawerBody').innerHTML='<div class="state-box"><div class="spinner"></div><br>Hleður…</div>';
  openDrawer();

  if(!n.isRead){window.cowork.callMcpTool(`mcp__${BC_SERVER}__mark_notifications_read`,{entryNos:String(n.entryNo)}).then(()=>{n.isRead=true;renderNotifications();renderSummary();}).catch(()=>{});}

  let msgs=[];
  try{
    const raw=await window.cowork.callMcpTool(`mcp__${BC_SERVER}__get_notification_thread`,{threadId:n.threadId});
    const data=unwrap(raw);
    msgs=Array.isArray(data.result)?data.result:Array.isArray(data.messages)?data.messages:Array.isArray(data)?data:[];
  }catch(e){}

  let html='';
  if(linked){
    const isOpen=linked.status==='Open';
    html+=`<div class="la-box${isOpen?'':' la-resolved'}">
      <div class="la-header">
        <span>📋 Tengd samþykktarbeiðni</span>
      </div>
      <div class="detail-row"><span class="detail-label">Skjalsnr.</span><strong>${linked.documentNo}</strong></div>
      <div class="detail-row"><span class="detail-label">Upphæð</span><span class="detail-amount" style="font-size:16px">${ISK.format(parseFloat(linked.amountLCY||0))}</span></div>
      <div class="detail-row"><span class="detail-label">Tegund</span><span>${linked.tableCaption||''} · ${linked.documentType||''}</span></div>
      <div class="detail-row"><span class="detail-label">Staða</span>${statusChip(linked.status)}</div>
      ${dueChip(linked.dueDate)?`<div class="detail-row"><span class="detail-label">Gjalddagi</span>${dueChip(linked.dueDate)}</div>`:''}
    </div>
    ${isOpen?`
      <div class="reject-form la-form" id="rejectForm_l">
        <div class="section-label" style="padding-top:4px">Ástæða höfnunar</div>
        <textarea class="reason-input" id="rejectReason_l" placeholder="Skrifaðu ástæðu…" rows="3"></textarea>
        <button class="btn-reject-confirm" onclick="doRejectLinked(${linked.entryNo},${linkedIdx},${idx})">Staðfesta höfnun</button>
      </div>
      <div class="drawer-actions la-actions">
        <button class="btn-action btn-approve" id="lBtn_approve" onclick="doApproveLinked(${linked.entryNo},${linkedIdx},${idx})">✓ Samþykkja</button>
        <button class="btn-action btn-reject"  id="lBtn_reject"  onclick="toggleRejectForm('rejectForm_l','rejectReason_l')">✗ Hafna</button>
        <button class="btn-action btn-defer"   id="lBtn_defer"   onclick="doDeferLinked(${linked.entryNo},${linkedIdx},${idx})">→ Framsenda</button>
      </div>
      <div class="action-result la" id="lResult"></div>
    `:`<div style="background:#faf5ff;padding:10px 20px;border-bottom:1px solid #ede9fe">
        ${linked.status==='Approved'?'<span class="resolved-note resolved-approved">✓ Þessi samþykkt var þegar samþykkt</span>':''}
        ${linked.status==='Rejected'?'<span class="resolved-note resolved-rejected">✗ Þessari samþykkt var hafnað</span>':''}
      </div>`}`;
  }

  html+='<div class="drawer-section"><div class="section-label">Skilaboð</div></div>';
  if(msgs.length===0){
    html+=`<div class="thread-msg"><div class="thread-msg-header"><span class="thread-sender">${formatUser(n.senderUserId)}</span><span class="thread-time">${relTime(n.systemCreatedAt)}</span></div><div class="thread-body">${parseBody(n.body||n.subject)}</div></div>`;
  } else {
    html+=msgs.map(m=>`<div class="thread-msg"><div class="thread-msg-header"><span class="thread-sender">${formatUser(m.senderUserId||m.sender||n.senderUserId)}</span><span class="thread-time">${relTime(m.systemCreatedAt||m.createdAt)}</span></div>${m.subject&&m.subject!==n.subject?`<div class="thread-subject">${m.subject}</div>`:''}<div class="thread-body">${parseBody(m.body||m.message||m.subject)}</div></div>`).join('');

      <textarea class="reason-input" id="replyText" placeholder="Skrifaðu svar til ${formatUser(n.senderUserId)}…" rows="3"></textarea>
      <div class="reply-send-row">
        <button class="btn-send" id="replyBtn" onclick="doReply(${idx})">Senda →</button>
        <button class="reply-cancel" onclick="toggleReply()">Hætta við</button>
      </div>
    </div>
    <div class="action-result" id="replyResult"></div>
  </div>`;

  document.getElementById('drawerBody').innerHTML=html;
}

function toggleRejectForm(fId,iId){const f=document.getElementById(fId);if(!f)return;f.classList.toggle('visible');if(f.classList.contains('visible'))document.getElementById(iId)?.focus();}
function setActionLoading(rId,btns){const el=document.getElementById(rId);if(el)el.innerHTML='<div class="action-loading"><span class="spinner-sm"></span>Vinn…</div>';btns.forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;});}
function setActionResult(rId,ok,msg,btns){const el=document.getElementById(rId);if(el)el.innerHTML=`<div class="action-${ok?'success':'error'}">${ok?'✓':'✗'} ${msg}</div>`;if(!ok)btns.forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=false;});}

async function doApprove(entryNo,idx){setActionLoading('aResult',['aBtn_approve','aBtn_reject','aBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__approve_entries`,{entryNo:Number(entryNo)}));if(res.status==='Success'||res.success){allApprovals[idx].status='Approved';setActionResult('aResult',true,'Samþykkt!',[]);renderApprovals();renderSummary();}else setActionResult('aResult',false,res.message||'Villa',['aBtn_approve','aBtn_reject','aBtn_defer']);}catch(e){setActionResult('aResult',false,e.message||e,['aBtn_approve','aBtn_reject','aBtn_defer']);}}
async function doDefer(entryNo,idx){setActionLoading('aResult',['aBtn_approve','aBtn_reject','aBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__delegate_approval`,{entryNo:Number(entryNo)}));if(res.status==='Success'||res.success)setActionResult('aResult',true,'Framsent!',[]);else setActionResult('aResult',false,res.message||'Villa',['aBtn_approve','aBtn_reject','aBtn_defer']);}catch(e){setActionResult('aResult',false,e.message||e,['aBtn_approve','aBtn_reject','aBtn_defer']);}}
async function doRejectApproval(entryNo,idx){const reason=document.getElementById('rejectReason_a')?.value||'';setActionLoading('aResult',['aBtn_approve','aBtn_reject','aBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__reject_entries`,{entryNo:Number(entryNo),comment:reason}));if(res.status==='Success'||res.success){allApprovals[idx].status='Rejected';setActionResult('aResult',true,'Höfnuð!',[]);renderApprovals();renderSummary();}else setActionResult('aResult',false,res.message||'Villa',['aBtn_approve','aBtn_reject','aBtn_defer']);}catch(e){setActionResult('aResult',false,e.message||e,['aBtn_approve','aBtn_reject','aBtn_defer']);}}
async function doApproveLinked(entryNo,aIdx,nIdx){setActionLoading('lResult',['lBtn_approve','lBtn_reject','lBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__approve_entries`,{entryNo:Number(entryNo)}));if(res.status==='Success'||res.success){if(aIdx>=0)allApprovals[aIdx].status='Approved';setActionResult('lResult',true,'Samþykkt!',[]);renderApprovals();renderSummary();}else setActionResult('lResult',false,res.message||'Villa',['lBtn_approve','lBtn_reject','lBtn_defer']);}catch(e){setActionResult('lResult',false,e.message||e,['lBtn_approve','lBtn_reject','lBtn_defer']);}}
async function doDeferLinked(entryNo,aIdx,nIdx){setActionLoading('lResult',['lBtn_approve','lBtn_reject','lBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__delegate_approval`,{entryNo:Number(entryNo)}));if(res.status==='Success'||res.success)setActionResult('lResult',true,'Framsent!',[]);else setActionResult('lResult',false,res.message||'Villa',['lBtn_approve','lBtn_reject','lBtn_defer']);}catch(e){setActionResult('lResult',false,e.message||e,['lBtn_approve','lBtn_reject','lBtn_defer']);}}
async function doRejectLinked(entryNo,aIdx,nIdx){const reason=document.getElementById('rejectReason_l')?.value||'';setActionLoading('lResult',['lBtn_approve','lBtn_reject','lBtn_defer']);try{const res=unwrap(await window.cowork.callMcpTool(`mcp__${BC_SERVER}__reject_entries`,{entryNo:Number(entryNo),comment:reason}));if(res.status==='Success'||res.success){if(aIdx>=0)allApprovals[aIdx].status='Rejected';setActionResult('lResult',true,'Höfnuð!',[]);renderApprovals();renderSummary();}else setActionResult('lResult',false,res.message||'Villa',['lBtn_approve','lBtn_reject','lBtn_defer']);}catch(e){setActionResult('lResult',false,e.message||e,['lBtn_approve','lBtn_reject','lBtn_defer']);}}

async function reload(){
  const btn=document.getElementById('btnReload');
  btn.disabled=true;btn.textContent='↺ Hleður…';
  document.getElementById('approvalBody').innerHTML='<div class="state-box"><div class="spinner"></div><br>Sæki samþykktir…</div>';
  document.getElementById('notifBody').innerHTML='<div class="state-box"><div class="spinner"></div><br>Sæki skilaboð…</div>';
  try{
    await Promise.all([loadApprovals(),loadNotifications(),loadCompanyName()]);
    buildIndexes();renderSummary();renderApprovals();renderNotifications();
    if(allApprovals.filter(a=>a.status==='Open').length===0&&allApprovals.length>0)setApprovalTab('all',document.getElementById('subTabAll'));
    document.getElementById('lastUpdated').textContent='Uppfært: '+new Date().toLocaleTimeString('is-IS');
  }catch(e){document.getElementById('approvalBody').innerHTML=`<div class="error-box">Villa: ${e.message||e}</div>`;}
  btn.disabled=false;btn.textContent='↺ Uppfæra';
}
// Wait for window.cowork to be injected by the Cowork platform before loading
function waitForCowork(attempts) {
  if (window.cowork && typeof window.cowork.callMcpTool === 'function') {
    reload();
    return;
  }
  if (attempts <= 0) {
    document.getElementById('approvalBody').innerHTML =
      '<div class="error-box">Villa: Cowork tenging ekki tiltæk — reyndu að endurhlaða síðuna.</div>';
    return;
  }
  setTimeout(() => waitForCowork(attempts - 1), 300);
}
waitForCowork(30);
